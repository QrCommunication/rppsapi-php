name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: [self-hosted, linux, x64, hetzner, qrcom]
    strategy:
      matrix:
        php-version: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, curl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: 
        find src -name "*.php" -exec php -l {} ; | grep -v "No syntax errors" || echo "All syntax OK"
        echo "Note: no PHPUnit tests in this repo, ran syntax check only"
