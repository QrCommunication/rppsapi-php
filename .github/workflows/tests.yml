name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: [self-hosted, linux, x64, hetzner, qrcom]
    strategy:
      matrix:
        php-version: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, curl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check (no PHPUnit tests in repo)
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            out=$(php -l "$f" 2>&1)
            if ! echo "$out" | grep -q "No syntax errors"; then
              echo "✗ $f"
              echo "$out"
              fail=1
            fi
          done < <(find src -name "*.php")
          [ "$fail" = "0" ] && echo "✓ All PHP files syntactically valid"
          exit $fail
